services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: just_shear
      POSTGRES_PASSWORD: just_shear_dev
      POSTGRES_DB: just_shear_production_hub
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U just_shear -d just_shear_production_hub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
